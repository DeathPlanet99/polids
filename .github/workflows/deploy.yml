name: Deploy (VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, polids]
    environment: production
    timeout-minutes: 30
    steps:
      - name: Update i build na VPS
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/polids' }}
        run: |
          cd "$DEPLOY_PATH"
          sh deploy/update.sh
